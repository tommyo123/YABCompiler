[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
    "crates/emu64",
]
default-members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
# Keep in sync with `crates/core/src/config.rs::VERSION` (the runtime
# source of truth surfaced in the About box and CLI banner).
version = "0.9.7"
edition = "2024"
authors = ["Tommy Olsen"]
license = "MIT"

[workspace.dependencies]
asm6502 = { git = "https://github.com/tommyo123/asm6502.git", tag = "v2.5.0" }
eframe = { version = "0.34.2", features = ["persistence"] }
yabcompiler-core = { path = "crates/core" }

[profile.release]
lto = true
strip = true
opt-level = 3
panic = "abort"
overflow-checks = false
codegen-units = 1
